<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Договор — Электромонтаж и Видеонаблюдение</title>
<style>
:root{--dark:#17202a;--mid:#5d6d7e;--border:#ccd3da;--light:#f4f6f8;--green:#1a7f37;--wa:#25D366;--blue:#1565c0;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--light);color:var(--dark)}
/* ─── LANG BAR ─── */
.langbar{background:var(--dark);padding:10px 20px;display:flex;justify-content:flex-end;gap:6px;position:sticky;top:0;z-index:999}
.lb{border:2px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 14px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;background:transparent;transition:.15s}
.lb.on,.lb:hover{background:#fff;color:var(--dark);border-color:#fff}
/* ─── WRAP ─── */
.wrap{max-width:1000px;margin:24px auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.07)}
h1{font-size:21px;margin-bottom:6px}
.sub{color:var(--mid);font-size:13px;margin-bottom:20px}
/* ─── FORM ─── */
.sh{font-size:14px;font-weight:700;color:var(--dark);border-bottom:2px solid var(--light);padding-bottom:5px;margin:20px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.full{grid-column:1/-1}
.f label{display:block;font-size:13px;font-weight:600;color:var(--mid);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:14px;background:#fafafa;transition:.15s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--dark);background:#fff}
.f textarea{min-height:78px;resize:vertical}
select[multiple]{height:115px}
/* ─── TABLE ─── */
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.tbl th,.tbl td{border:1px solid #e0e4e8;padding:8px 9px}
.tbl th{background:#f7f9fa;font-weight:600}
.tbl td input,.tbl td select{border:1px solid #ddd;border-radius:6px;padding:5px 7px;font-size:13px}
.tbl td input[type=number]{width:80px}
.iname{width:100%;min-width:100px}
.r{text-align:right;font-weight:600}
.tfoot-row td{font-weight:700;background:#f0f2f4}
/* ─── BUTTONS ─── */
.brow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{padding:10px 17px;border:0;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:600;transition:.12s}
.bp{background:var(--dark);color:#fff}.bp:hover{background:#2c3e50}
.bs{background:#e8ecf0;color:var(--dark)}.bs:hover{background:#d8dde3}
.bg{background:var(--green);color:#fff}.bg:hover{background:#155d27}
.bw{background:var(--wa);color:#fff}.bw:hover{background:#1ea559}
button:disabled{opacity:.35;cursor:not-allowed}
/* ─── NOTE ─── */
.note{padding:11px 15px;border-radius:var(--r);font-size:13px;margin:12px 0;line-height:1.5}
.n-y{background:#fff8db;border-left:4px solid #e67e22}
.n-g{background:#f0fdf4;border-left:4px solid var(--green)}
.n-b{background:#e8f4fd;border-left:4px solid var(--blue)}
/* ─── CONTRACT ─── */
.contract{margin-top:26px;padding-top:20px;border-top:2px solid #222;line-height:1.62;font-size:14px}
.contract h2{text-align:center;font-size:17px;margin-bottom:3px}
.contract p{margin:7px 0}
.contract table{width:100%;border-collapse:collapse;margin:9px 0;font-size:13px}
.contract th,.contract td{border:1px solid #ddd;padding:7px 9px}
.contract th{background:#f3f5f7;font-weight:600}
/* ─── SIGNATURES ─── */
.sigwrap{margin-top:24px;border:1.5px solid var(--border);border-radius:12px;padding:22px;background:#fafafa}
.sigwrap h3{font-size:16px;margin-bottom:6px}
.siggrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
.sigbox{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:15px}
.sigbox h4{font-size:13px;color:var(--mid);margin-bottom:9px}
/* KEY FIX: canvas must have fixed CSS height, width 100% */
canvas.pad{display:block;width:100%;height:150px;border:2px dashed #aaa;border-radius:8px;touch-action:none;background:#fffef8;cursor:crosshair}
canvas.pad.ok{border:2px solid var(--green);background:#f6fff8}
.sts{font-size:12px;color:#999;margin-top:6px;min-height:18px}
.sts.ok{color:var(--green);font-weight:700}
.sbrow{display:flex;gap:6px;margin-top:8px}
.sbrow button{font-size:12px;padding:7px 12px}
/* ─── ACTION BAR ─── */
.actbar{display:none;margin-top:18px;background:#f0fdf4;border:1.5px solid var(--green);border-radius:12px;padding:18px}
.actbar .dmsg{font-size:15px;font-weight:700;color:var(--green);margin-bottom:10px}
.stamp{background:#e8f4fd;padding:11px 14px;border-radius:8px;font-size:12px;color:#444;margin-top:12px;line-height:1.7}
/* ─── PRINT ─── */
@media print{.langbar,.noprint{display:none!important}.wrap{box-shadow:none;margin:0;max-width:none;padding:12px}.contract{border-top:1px solid #000}canvas.pad{border:1px solid #ccc}}
@media(max-width:680px){.grid,.siggrid{grid-template-columns:1fr}.wrap{margin:0;border-radius:0;padding:14px}}
</style>
</head>
<body>

<div class="langbar">
  <span style="color:#aaa;font-size:12px;margin-right:4px">🌐</span>
  <button class="lb on" onclick="setLang('ru')">RU</button>
  <button class="lb" onclick="setLang('kz')">ҚЗ</button>
  <button class="lb" onclick="setLang('en')">EN</button>

<div class="wrap">

    <div class="f"><label id="xL_bal"></label><input id="balance" readonly style="background:#f5f5f5;font-weight:700"></div>
    <div class="f"><label id="xL_pay"></label>
      <select id="payment">
        <option id="xO_p1"></option><option id="xO_p2" selected></option>
        <option id="xO_p3"></option><option id="xO_p4"></option>
      </select>
    </div>
  </div>

  <div class="sh" id="xS4"></div>
  <div style="overflow-x:auto">
  <table class="tbl">
    <thead><tr>
      <th style="width:30px">#</th>
      <th id="xH_n"></th><th id="xH_u" style="width:70px"></th>
      <th id="xH_q" style="width:80px"></th><th id="xH_p" style="width:100px"></th>
      <th id="xH_s" style="width:110px"></th><th style="width:30px"></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
    <tfoot><tr class="tfoot-row">
      <td colspan="5" class="r" id="xTotLbl"></td>
      <td class="r" id="specTot">0</td><td></td>
    </tr></tfoot>
  </table>
  </div>
  <div class="brow">
    <button class="bs" onclick="addRow()" id="xB_add"></button>
    <button class="bp" onclick="makeContract()" id="xB_gen"></button>
    <button class="bs" onclick="window.print()" id="xB_prn"></button>
  </div>
</div><!-- /frmSec -->

<!-- ══════════════ CONTRACT ══════════════ -->
<div id="contract" class="contract"></div>

<!-- ══════════════ SIGNATURES ══════════════ -->
<div class="sigwrap noprint" id="sigSec" style="display:none">
  <h3 id="xSG_title"></h3>
  <div class="note n-g" id="xSG_note"></div>
  <div class="siggrid">
    <div class="sigbox">
      <h4 id="xSG_et"></h4>
      <!-- width/height set by JS initPad -->
      <canvas class="pad" id="eCanvas"></canvas>
      <div class="sts" id="eSts"></div>
      <div class="sbrow">
        <button class="bp" id="eBtn" onclick="doSign('e')"></button>
        <button class="bs" onclick="clearPad('e')"></button>
      </div>
    </div>
    <div class="sigbox">
      <h4 id="xSG_ct"></h4>
      <canvas class="pad" id="cCanvas"></canvas>
      <div class="sts" id="cSts"></div>
      <div class="sbrow">
        <button class="bp" id="cBtn" onclick="doSign('c')"></button>
        <button class="bs" onclick="clearPad('c')"></button>
      </div>
    </div>
  </div>
  <div class="actbar" id="actBar">
    <div class="dmsg" id="xAB_msg"></div>
    <div class="brow">
      <button class="bg" onclick="dlSigned()" id="xAB_dl"></button>
      <button class="bw" onclick="sendWA()" id="xAB_wa"></button>
      <button class="bs" onclick="window.print()" id="xAB_pr"></button>
    </div>
    <div class="stamp" id="stampTxt"></div>
  </div>
</div>

</div><!-- /wrap -->

let lang='ru';
function L(k){return(TR[lang]||TR.ru)[k]||(TR.ru[k]||k)}

function setLang(l){
  lang=l;
  document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('on',b.textContent.trim()===({ru:'RU',kz:'ҚЗ',en:'EN'}[l])));
  applyAll();
}

/* ══════════════════════════════════════
   SIGNATURE PAD — FIXED IMPLEMENTATION
══════════════════════════════════════ */
let eSigned=false,cSigned=false,eTS='',cTS='';

function initPad(id){
  const cv=G(id);
  if(!cv) return;

  /* Set canvas BUFFER size from its CSS rendered size.
     We do this once after layout, using a fixed height of 150px
     and the actual rendered width. */
  function setupSize(){
    const w=cv.offsetWidth||cv.parentElement?.offsetWidth||340;
    cv.width=w;    /* buffer pixels = CSS pixels (no DPR scaling to avoid offset bugs) */
    cv.height=150;
  }
  setupSize();
  /* re-setup on resize but keep canvas clear */
  window.addEventListener('resize',()=>{ setupSize(); });

  let drawing=false, lx=0, ly=0;

  function getXY(e){
    const rect=cv.getBoundingClientRect();
    /* Scale from CSS pixels → canvas pixels */
    const scaleX=cv.width/rect.width;
    const scaleY=cv.height/rect.height;
    const src=e.touches?e.touches[0]:e;
    return[(src.clientX-rect.left)*scaleX,(src.clientY-rect.top)*scaleY];
  }

  function startDraw(e){
    e.preventDefault();
    drawing=true;
    [lx,ly]=getXY(e);
  }
  function moveDraw(e){
    if(!drawing) return;
    e.preventDefault();
    const[x,y]=getXY(e);
    const ctx=cv.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(lx,ly);
    ctx.lineTo(x,y);
    ctx.strokeStyle='#111';   /* solid black — clearly visible */
    ctx.lineWidth=2.5;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.stroke();
    [lx,ly]=[x,y];
  }
  function stopDraw(){ drawing=false; }

  cv.addEventListener('mousedown', startDraw);
  cv.addEventListener('mousemove', moveDraw);
  cv.addEventListener('mouseup',   stopDraw);
  cv.addEventListener('mouseleave',stopDraw);
  cv.addEventListener('touchstart', startDraw, {passive:false});
  cv.addEventListener('touchmove',  moveDraw,  {passive:false});
  cv.addEventListener('touchend',   stopDraw);
}

function padEmpty(id){
  const cv=G(id);
  try{
    const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;
    return !Array.from(d).some(v=>v>0);
  }catch(e){return true}
}
function wipePad(who){
  const cv=G(who==='e'?'eCanvas':'cCanvas');
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
}

function doSign(who){
  const cvId=who==='e'?'eCanvas':'cCanvas';
  if(padEmpty(cvId)){alert(L('NoSig'));return;}
  if(!confirm(L('Confirm'))) return;

  const ts=new Date().toLocaleString('ru-RU');
  const img=G(cvId).toDataURL('image/png');
  G(cvId).className='pad ok';

  const stsEl=G(who+'Sts'), btnEl=G(who+'Btn'), plcId=who==='e'?'eSigPlc':'cSigPlc';
  stsEl.textContent=L('Sts_ok')(ts); stsEl.className='sts ok';
  btnEl.disabled=true;
  const plc=G(plcId);
  if(plc) plc.innerHTML=`${L('SL')}:<br><img src="${img}" style="height:55px;border:1px solid #ddd;border-radius:4px;margin-top:4px;display:block"><small style="color:#555;font-size:11px">${L('ST')}: ${ts}</small>`;

  if(who==='e'){eSigned=true;eTS=ts;}
  else{cSigned=true;cTS=ts;}
  checkBoth();
}

function clearPad(who){
  wipePad(who);
  const stsEl=G(who+'Sts'), btnEl=G(who+'Btn'), plcId=who==='e'?'eSigPlc':'cSigPlc';
  if(who==='e'){eSigned=false;eTS='';}
  else{cSigned=false;cTS='';}
  stsEl.textContent=L('Sts_empty'); stsEl.className='sts';
  btnEl.disabled=false;
  G(who==='e'?'eCanvas':'cCanvas').className='pad';
  const plc=G(plcId); if(plc) plc.textContent=L('SigIn');
  checkBoth();
}

function checkBoth(){
  const bar=G('actBar');
  if(eSigned&&cSigned){
    bar.style.display='block';
    const now=new Date().toLocaleString('ru-RU');
    G('stampTxt').textContent=L('Stamp')(eTS,cTS,now);
    bar.scrollIntoView({behavior:'smooth'});
  } else {
    bar.style.display='none';
  }
}

function sendWA(){
  let ph=(G('phone').value||'').replace(/\D/g,'');
  if(ph.startsWith('8')&&ph.length===11) ph='7'+ph.slice(1);
  if(!ph){alert(L('NoPhone'));return;}
  const d={
    num:G('num').value, cust:G('customer').value, addr:G('objectAddress').value,
    tot:(+G('total').value||0).toLocaleString('ru-RU'),
    paid:(+G('paid').value||0).toLocaleString('ru-RU'),
    bal:G('balance').value||'0',
    date:new Date().toLocaleDateString('ru-RU')
  };
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(L('WA')(d))}`,'_blank');
}
